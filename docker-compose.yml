services:
  admin:
    build:
      context: .
      dockerfile: ADMIN/Dockerfile
    # Every port is bound to 127.0.0.1 so only nginx on this box can reach
    # the apps. A bare "5000:5000" publishes on 0.0.0.0 and Docker punches
    # through the firewall, letting anyone hit IP:port and skip nginx's
    # auth_request login checks.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./ADMIN/users.json:/app/ADMIN/users.json
      - ./Logger/logs.db:/app/Logger/logs.db
      # Mount the folder, not lockers.csv itself: save_lockers() swaps in a
      # temp file with os.replace, and renaming over a single-file bind mount
      # fails with "Device or resource busy".
      - ./noke2excelrevamp/data:/app/noke2excelrevamp/data
    restart: unless-stopped

  dockscheduler:
    build:
      context: .
      dockerfile: DockScheduler/Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - ./DockScheduler/.env
    volumes:
      - ./DockScheduler/instance/dockscheduler.db:/app/DockScheduler/instance/dockscheduler.db
      - ./Logger/logs.db:/app/Logger/logs.db
      - ./ADMIN/users.json:/app/ADMIN/users.json
    restart: unless-stopped

  soundparking:
    build:
      context: ./SoundParking
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # server.js's ADMIN_URL default (127.0.0.1:5000) only worked when
      # everything ran on bare metal; across containers it must reach ADMIN
      # by its Compose service name on the shared default network.
      - ADMIN_URL=http://admin:5000
    volumes:
      - ./SoundParking/parking.db:/app/parking.db
      # logger.js does path.join(__dirname, '..', '..', 'Logger', 'logs.db'),
      # which from /app resolves to /Logger/logs.db (matches the /home/Logger
      # symlink trick already in prod), not a normal project-relative path.
      - ./Logger/logs.db:/Logger/logs.db
    restart: unless-stopped

  tools-main:
    build:
      context: .
      dockerfile: tools-main/Dockerfile
    ports:
      - "127.0.0.1:5004:5000"
    restart: unless-stopped

  noke2excelrevamp:
    build:
      context: .
      dockerfile: noke2excelrevamp/Dockerfile
    ports:
      - "127.0.0.1:5002:5000"
    env_file:
      - ./noke2excelrevamp/.env
    volumes:
      - ./noke2excelrevamp/spreads:/app/noke2excelrevamp/spreads
      # Same folder ADMIN writes to, so edits show up here immediately.
      - ./noke2excelrevamp/data:/app/noke2excelrevamp/data
    restart: unless-stopped
