services:
  admin:
    build:
      context: .
      dockerfile: ADMIN/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./ADMIN/users.json:/app/ADMIN/users.json
      - ./Logger/logs.db:/app/Logger/logs.db
    restart: unless-stopped

  dockscheduler:
    build:
      context: .
      dockerfile: DockScheduler/Dockerfile
    ports:
      - "5002:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - ./DockScheduler/.env
    volumes:
      - ./DockScheduler/instance/dockscheduler.db:/app/DockScheduler/instance/dockscheduler.db
      - ./Logger/logs.db:/app/Logger/logs.db
    restart: unless-stopped

  soundparking:
    build:
      context: ./SoundParking
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./SoundParking/parking.db:/app/parking.db
      # logger.js does path.join(__dirname, '..', '..', 'Logger', 'logs.db'),
      # which from /app resolves to /Logger/logs.db (matches the /home/Logger
      # symlink trick already in prod), not a normal project-relative path.
      - ./Logger/logs.db:/Logger/logs.db
    restart: unless-stopped

  tools-main:
    build:
      context: .
      dockerfile: tools-main/Dockerfile
    ports:
      - "5004:5000"
    restart: unless-stopped

  noke2excelrevamp:
    build:
      context: .
      dockerfile: noke2excelrevamp/Dockerfile
    ports:
      - "5005:5000"
    env_file:
      - ./noke2excelrevamp/.env
    volumes:
      - ./noke2excelrevamp/spreads:/app/noke2excelrevamp/spreads
      - ./noke2excelrevamp/lockers.csv:/app/noke2excelrevamp/lockers.csv
    restart: unless-stopped
